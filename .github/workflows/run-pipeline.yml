name: Run pipeline

# Calkit's own pipeline computes claims in its docs, e.g., the LaTeX image's
# size, so a pull request that makes one stale gets it rerun and committed
# back, e.g., the one pinning a newly published image
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# One per branch, so two runs don't race to push to it
concurrency:
  group: run-pipeline-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  run:
    name: run
    # A fork's branch can't be pushed to with this repo's token
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch itself rather than the merge commit, so results can
          # be pushed back to it
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Configure Git credentials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Stages use what this branch's Calkit can do, not the last release,
      # and the action only installs Calkit when it isn't already there.
      # Its dependencies come from uv.lock, as with uv run locally, since
      # e.g., another ruamel.yaml wraps dvc.lock's lines differently
      - name: Install Calkit from this branch
        run: |
          uv export --frozen --no-hashes --no-emit-project \
            -o "$RUNNER_TEMP/constraints.txt"
          uv tool install --editable . \
            --constraints "$RUNNER_TEMP/constraints.txt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run Calkit
        uses: ./actions/run
        with:
          # Its Docker environments only pull public images
          login_ghcr: "false"
