name: Check Calkit pipeline
description: >
  Fail if a Calkit project's pipeline is stale, i.e., its committed outputs
  don't match its inputs, saying which stages and what changed.
branding:
  icon: check-circle
  color: green
inputs:
  version:
    description: >-
      Version of calkit-python to install, e.g., 0.54.0. By default, the
      version of the action's release tag, so a new release can't fail the
      check by itself, or the latest release when the action is referenced by
      a branch or commit. Ignored if Calkit is already installed.
    required: false
    default: ""
  working_directory:
    description: Project directory, relative to the workspace.
    required: false
    default: "."
  env_check:
    description: >-
      Whether to check environments, which creates them, so a change to one's
      definition makes the stages using it stale. Their tools, e.g., Conda,
      must then be set up first.
    required: false
    default: "false"
outputs:
  passed:
    description: Whether the pipeline is up to date ("true" or "false").
    value: ${{ steps.check.outputs.passed }}
  summary:
    description: The Markdown job summary Calkit wrote, listing stale stages.
    value: ${{ steps.check.outputs.summary }}
runs:
  using: composite
  steps:
    - name: Check for uv and Calkit
      id: tools
      shell: bash
      run: |
        if command -v uv >/dev/null 2>&1; then
          echo "uv_missing=false" >> "$GITHUB_OUTPUT"
        else
          echo "uv_missing=true" >> "$GITHUB_OUTPUT"
        fi
        if command -v calkit >/dev/null 2>&1; then
          echo "calkit_missing=false" >> "$GITHUB_OUTPUT"
        else
          echo "calkit_missing=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup uv
      if: ${{ steps.tools.outputs.uv_missing == 'true' && steps.tools.outputs.calkit_missing == 'true' }}
      uses: astral-sh/setup-uv@v5

    - name: Install Calkit
      if: ${{ steps.tools.outputs.calkit_missing == 'true' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        version="$VERSION"
        if [ -z "$version" ]; then
          version=$(bash "$GITHUB_ACTION_PATH/get-version.sh" "$GITHUB_ACTION_PATH")
        fi
        if [ -n "$version" ]; then
          uv tool install "calkit-python==$version"
        else
          uv tool install calkit-python
        fi
        uv tool dir --bin >> "$GITHUB_PATH"

    # Calkit annotates the result and writes the job summary itself, since
    # GITHUB_ACTIONS is set
    - name: Check pipeline
      id: check
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ENV_CHECK: ${{ inputs.env_check }}
      run: |
        calkit --version
        args=(--category pipeline --check)
        if [ "$ENV_CHECK" != "true" ]; then
          args+=(--no-env-check)
        fi
        # The shell exits on error, so the result is kept rather than failing
        code=0
        calkit status "${args[@]}" || code=$?
        if [ "$code" = 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        delimiter="calkit-summary-$RANDOM$RANDOM"
        {
          echo "summary<<$delimiter"
          cat "$GITHUB_STEP_SUMMARY"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
        # E.g., a version of Calkit without --check
        if [ "$code" != 0 ] && [ ! -s "$GITHUB_STEP_SUMMARY" ]; then
          echo "::error title=Calkit check::'calkit status --check' exited $code with no result"
        fi
        exit "$code"
