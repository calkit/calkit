name: Build assistant

# The default token needs no write access; the job elevates to attach the
# executable to the release
permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows
    # Tags look like assistant/vX.Y.Z, matching the extensions' convention,
    # so releasing one doesn't build the other
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'assistant/v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Build with PyInstaller
        run: >-
          uv run pyinstaller --onefile --icon resources/icon.ico
          --name calkit-assistant main.py
      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: calkit-assistant-windows
          path: assistant/dist/calkit-assistant.exe
      - name: Attach the executable to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:TAG_NAME -replace '^assistant/v', ''
          Copy-Item dist/calkit-assistant.exe "dist/calkit-assistant-$version-windows.exe"
          gh release upload "$env:TAG_NAME" "dist/calkit-assistant-$version-windows.exe" --clobber
