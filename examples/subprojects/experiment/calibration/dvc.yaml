stages:
  calibrate:
    cmd: calkit xenv -n py --no-check -- python scripts/calibrate.py
    deps:
      - scripts/calibrate.py
      - uv.lock
    outs:
      - results/calibration.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'calibrate' stage in calkit.yaml.
      Changes made here will be overwritten.
