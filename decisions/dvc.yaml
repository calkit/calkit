      - results/ruamel-yaml-clib/clib.json:
          cache: false
          persist: false
    frozen: true
    desc: Automatically generated from the 'parse-dvc-lock-clib' stage in
      calkit.yaml. Changes made here will be overwritten.
  compare-dvc-lock-parsing:
    cmd: calkit xenv -n pure --no-check -- python
      scripts/compare-dvc-lock-parsing.py
    deps:
      - scripts/compare-dvc-lock-parsing.py
      - results/ruamel-yaml-clib/pure.json
      - results/ruamel-yaml-clib/clib.json
      - .calkit/env-locks/pure
