name: Run tests

# The default token needs no write access; jobs elevate as needed
permissions:
  contents: read

on: pull_request

env:
  CALKIT_TEST_ZENODO_TOKEN: ${{ secrets.CALKIT_ZENODO_TOKEN }}

jobs:
  # Always runs so the gated job below can be a branch protection required
  # check; hub-only PRs are covered by test-hub.yml instead
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      cli: >-
        ${{ steps.filter.outputs.cli == 'true'
        || steps.docs.outputs.checked == 'true' }}
      jlab: ${{ steps.filter.outputs.jlab }}
      vscode: ${{ steps.filter.outputs.vscode }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Negated patterns are ignored under the default 'some'
          # quantifier, which would make this match every change
          predicate-quantifier: "every"
          filters: |
            # Prose and docs don't affect the package; the few docs files a
            # test does read are picked up by the step below
            cli:
              - "**"
              - "!hub/**"
              - "!vscode-ext/**"
              - "!browser-ext/**"
              - "!docs/**"
              - "!*.md"
              - "!mkdocs.yml"
              - "!CITATION.cff"
              - "!LICENSE"
            # The JupyterLab extension depends on the core Python package,
            # so run its tests for any change outside the other subprojects
            jlab:
              - "**"
              - "!hub/**"
              - "!vscode-ext/**"
              - "!browser-ext/**"
              - "!docs/**"
              - "!*.md"
              - "!mkdocs.yml"
              - "!CITATION.cff"
              - "!LICENSE"
            vscode:
              - "vscode-ext/**"
            browser:
              - "browser-ext/**"
      # A separate step because these are alternatives, which the 'every'
      # quantifier above can't express. Tests check these files against
      # the models, so a hand edit to them has to run the suite.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: docs
        with:
          filters: |
            checked:
              - "docs/schemas/calkit.json"
              - "docs/pipeline/index.md"
              - "docs/environments.md"

  main:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed so the example project in examples/basic is checked
          # against the calkit.yaml JSON schema
          submodules: true
      - name: Configure Git Credentials
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config --global init.defaultBranch main
          git config --global push.autoSetupRemote true
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The tests build many uv environments; a cold
          # cache re-downloads every wheel each run
          enable-cache: true
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          auto-activate-base: true
          conda-remove-defaults: true
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          run-install: false
      - name: Install Juliaup
        uses: julia-actions/install-juliaup@8d13b44e0eb1620c4e2d2d0a4ceee7d98100b955 # v3.1.6
        with:
          channel: "1" # Installs the latest v1 Julia version via Juliaup
      # Juliaup installs Julia but leaves the depot empty, and the first Pkg
      # operation then precompiles Pkg and downloads the General registry.
      # Tests that isolate themselves in a throwaway depot append this one,
      # so whatever is here is read rather than rebuilt -- measured at 65s
      # cold vs 1s warm for a single `Pkg.instantiate` on an empty project.
      # Restore only. This workflow is `on: pull_request`, so anything it
      # saved would land in `refs/pull/N/merge`, where no other pull request
      # can read it---25+ such entries piled up on one pull request alone,
      # evicting useful caches against the repository's 10 GB limit while
      # every run still started cold. warm-julia-depot.yml publishes the
      # entry these keys restore, in the default branch's scope.
      - name: Restore the Julia depot
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/packages
            ~/.julia/registries
          key: julia-depot-${{ runner.os }}-
          restore-keys: julia-depot-${{ runner.os }}-
      # Cheap on a cache hit, and on a miss it pays the precompile once here
      # rather than inside whichever test happens to reach Julia first
      - name: Warm the Julia depot
        run: julia -e 'using Pkg; Pkg.Registry.add("General")'
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: latest
      - name: Run tests
        run: |
          pixi --version
          conda --version
          docker --version || true
          juliaup --version
          Rscript --version
          uv --version
          uv run pytest -n 4 --durations=10
  jupyterlab-ext:
    needs: changes
    if: needs.changes.outputs.jlab == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jupyterlab-ext
    steps:
      - uses: actions/checkout@v7
      # The UI tests initialize a project from inside JupyterLab, which
      # commits, and Git refuses to commit without an identity
      - name: Configure Git Credentials
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config --global init.defaultBranch main
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The tests build many uv environments; a cold
          # cache re-downloads every wheel each run
          enable-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install JupyterLab extension dependencies
        run: uv run jlpm install
      - name: Build JupyterLab extension
        run: uv run jlpm build:prod
      - name: Run JupyterLab extension front end unit tests
        run: uv run jlpm test
      - name: Install UI test dependencies
        run: |
          cd ui-tests
          uv run jlpm install
          uv run jlpm playwright install
      - name: Run UI tests
        run: |
          cd ui-tests
          uv run jlpm playwright test -u --reporter=list
      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: jupyterlab-ext/ui-tests/test-results/
          retention-days: 7
  vscode-ext:
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-ext
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run VS Code extension tests
        run: npm test
  browser-ext:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-ext
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: browser-ext/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run browser extension unit tests
        run: npm test
      - name: Build browser extension
        run: npm run build
