name: Build assistant

# The default token needs no write access; the job elevates to attach the
# executable to the release
permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows
    # Tags look like assistant/vX.Y.Z, matching the extensions' convention,
    # so releasing one doesn't build the other
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'assistant/v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and history, so the version can be described from them
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # A release gets its tag's version, and a manual build the latest tag
      # plus commits since, e.g., 0.0.6-3-gabc1234
      # Bash, since Windows PowerShell's Set-Content mangles the emoji
      - name: Set the version from the tag
        shell: bash
        run: |
          version=$(git describe --tags --match 'assistant/v*')
          version=${version#assistant/v}
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" main.py
          grep -q "^__version__ = \"$version\"$" main.py
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build with PyInstaller
        run: >-
          uv run pyinstaller --onefile --icon resources/icon.ico
          --name calkit-assistant main.py
      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: calkit-assistant-windows
          path: assistant/dist/calkit-assistant.exe
      - name: Attach the executable to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          Copy-Item dist/calkit-assistant.exe "dist/calkit-assistant-$env:VERSION-windows.exe"
          gh release upload "$env:TAG_NAME" "dist/calkit-assistant-$env:VERSION-windows.exe" --clobber
