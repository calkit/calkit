name: research
title: Research
description: >-
  Product research for Calkit: what would get researchers to adopt it,
  which problems in an analysis change its conclusions, who finds them, and
  what would catch them, run in studies and rounds that add to the record
  rather than replace it.

questions:
  # TODO: needs human review
  - question: >-
      What would get researchers to adopt Calkit, with reproducibility as a
      side effect?
    hypothesis: >-
      Question-driven development with a coding agent, like test-driven
      development for research: a person writes a question with its
      hypothesis and approach, an agent builds the pipeline and evidence
      that answer it, and the person reviews the approach, checks the
      outputs, and signs off; when inputs change, the answer goes stale and
      the question is open again.
    approach: >-
      At a workshop, each participant takes one question about their own
      data through that loop with an agent in Calkit, compared with asking
      the agent to make a figure, and is interviewed on the alternatives:
      figures and numbers that update themselves (revisions without the
      redo), others being able to use the research (installable packages),
      and running on a cluster from a laptop.
    notes: >-
      Not yet tested. Open until the workshop in
      adoption/workshop-protocol.md is run and its sessions are summarized
      by a stage.

  - question: >-
      With unlimited reading, do agent auditors need a research tool to find
      the bugs in a small analysis?
    answer:
      if r1_found == r1_runs and r2_merge == r2_merge_n and r2_fastest == "none": >-
        No. In round 1, each of the {r1_runs} auditors, one per tool, found
        the planted bug, in {r1_min_s:.0f} to {r1_max_s:.0f} s, from the
        same giveaway: the report says participants with missing SES were
        excluded, yet its sample is everyone enrolled. In round 2, with
        subtler bugs and {r2_min_runs} audits per arm, all {r2_merge_n}
        auditors found the merge that silently dropped a site, and the arm
        with no framework or version control was fastest (mean {none_s:.0f}
        s, against Calkit {calkit_s:.0f} s, ASTRA {astra_s:.0f} s, and
        OpenResearch {orx_s:.0f} s). The arms differed only on the bug in
        the model's reference level (Calkit {calkit_ref}/{calkit_ref_n},
        ASTRA {astra_ref}/{astra_ref_n}, no framework
        {none_ref}/{none_ref_n}, OpenResearch {orx_ref}/{orx_ref_n}), too
        few runs to call. Calkit kept a stale number out of the report by
        filling numbers in from results; in every other arm, auditors found
        it by matching numbers to files by hand.
      else: >-
        Not settled; see results/audit-speed.md for every run.
    evidence:
      - kind: result
        path: results/audit-speed.json
        values:
          r1_runs: rounds.1.n_runs
          r1_found: rounds.1.n_found_bug
          r1_min_s: rounds.1.seconds.min
          r1_max_s: rounds.1.seconds.max
          r2_min_runs: rounds.2.min_runs_per_arm
          r2_merge: rounds.2.found.merge.found
          r2_merge_n: rounds.2.found.merge.possible
          r2_fastest: rounds.2.fastest_arm
          none_s: rounds.2.arms.none.mean_seconds
          calkit_s: rounds.2.arms.calkit.mean_seconds
          astra_s: rounds.2.arms.astra.mean_seconds
          orx_s: rounds.2.arms.openresearch.mean_seconds
          none_ref: rounds.2.arms.none.found.reference_level.found
          none_ref_n: rounds.2.arms.none.found.reference_level.possible
          calkit_ref: rounds.2.arms.calkit.found.reference_level.found
          calkit_ref_n: rounds.2.arms.calkit.found.reference_level.possible
          astra_ref: rounds.2.arms.astra.found.reference_level.found
          astra_ref_n: rounds.2.arms.astra.found.reference_level.possible
          orx_ref: rounds.2.arms.openresearch.found.reference_level.found
          orx_ref_n: rounds.2.arms.openresearch.found.reference_level.possible
      - kind: table
        path: results/audit-speed.md

  - question: >-
      At human reading speed, which problems in a small analysis do agent
      auditors miss?
    answer:
      if v2_merge == 0 and v2_stale == v2_stale_n and v2_min < v2_budget and v1_merge == rec_merge: >-
        The silent row loss. Reading through a tool that charges a person's
        time, with realistic costs (a {v2_budget} min budget, code read at
        {v2_code} lines per min, and {v2_script} min to write a script of
        one's own), none of the {v2_merge_n} auditors, one per arm, caught
        the merge that dropped a site. They matched numbers to saved
        outputs or reran the authors' pipeline, which reproduces the bug,
        and stopped with time left (mean {v2_min:.1f} min). Cheap checks
        still got done: the stale typed number was found in
        {v2_stale}/{v2_stale_n} arms where it could occur, and the wrong
        reference level, visible in the code, in {v2_ref}/{v2_ref_n}. With
        scripts cheaper to write ({v1_script} min), the row loss was found
        only by auditors who recomputed results with their own scripts
        ({rec_merge} of {rec_n}).
      else: >-
        Not settled; see results/audit-speed.md for every run.
    evidence:
      - kind: result
        path: results/audit-speed.json
        values:
          v2_budget: rounds.3.settings.v2.costs.budget_min
          v2_code: rounds.3.settings.v2.costs.code_lines_per_min
          v2_script: rounds.3.settings.v2.costs.own_script_min
          v2_merge: rounds.3.settings.v2.found.merge.found
          v2_merge_n: rounds.3.settings.v2.found.merge.possible
          v2_min: rounds.3.settings.v2.mean_simulated_minutes
          v2_stale: rounds.3.settings.v2.found.stale_number.found
          v2_stale_n: rounds.3.settings.v2.found.stale_number.possible
          v2_ref: rounds.3.settings.v2.found.reference_level.found
          v2_ref_n: rounds.3.settings.v2.found.reference_level.possible
          v1_script: rounds.3.settings.v1.costs.own_script_min
          v1_merge: rounds.3.settings.v1.found.merge.found
          rec_n: rounds.3.checked_by.recomputed with own scripts.n_runs
          rec_merge: rounds.3.checked_by.recomputed with own scripts.found.merge.found
      - kind: table
        path: results/audit-speed.md

  - question: >-
      Do agent auditors catch the data problems that changed conclusions in
      published work?
    answer:
      if hr_n - hr_found == 1 and m_leak == 0 and m_n == 2: >-
        Not reliably, even with unlimited reading. In Hill & Roberts
        (2023), {edu_n} of {edu_nv:,} respondents' education is coded
        {edu_code} (the survey platform's "none of the above") and used as
        a continuous covariate; dropping them reverses the association
        between education and acquiescence (corrigendum
        doi:10.1017/pan.2024.27). {hr_found} of {hr_n} auditors found it;
        the other never tabulated the raw education values. In Muchlinski
        et al. (2016), {m_fig}/{m_n} found the ROC figure's AUC disagreeing
        with the text (Wang 2019), but {m_leak}/{m_n} found the leak that
        Kapoor & Narayanan (2023) show erases the random forest's advantage
        over logistic regression: imputation fit on training and test data
        together. The imputation step isn't in the package, and both
        auditors flagged it as missing.
      else: >-
        Not settled; see results/real-packages.md for every run.
    evidence:
      - kind: result
        path: results/real-packages.json
        values:
          hr_found: packages.hill-roberts-2023.found.sentinel
          hr_n: packages.hill-roberts-2023.n_runs
          m_fig: packages.muchlinski-2016.found.figure_mismatch
          m_leak: packages.muchlinski-2016.found.leakage
          m_n: packages.muchlinski-2016.n_runs
      - kind: result
        path: results/hill-roberts-profile.json
        values:
          edu_n: files.data/LucidWideFile.csv.flags.education.0.n
          edu_nv: files.data/LucidWideFile.csv.flags.education.0.n_values
          edu_code: files.data/LucidWideFile.csv.flags.education.0.examples.0
      - kind: table
        path: results/real-packages.md

  - question: >-
      Would an automatic data profile have surfaced the problems auditors
      missed?
    answer:
      if n_files_flagged == 1 and edu_n > 0 and lucid_edu_n == edu_n: >-
        For the sentinel code, yes. Two generic rules per numeric column,
        knowing nothing about the answer (a few negatives in an otherwise
        non-negative column, and values far outside the 1st-99th percentile
        span), raised {n_flags} flags in {n_columns} columns, all in
        {n_files_flagged} of the archive's {n_files} files: the {edu_code}
        code in education and lucid_education ({edu_n} values each), and
        {hhi_code} in lucid_hhi ({hhi_n} values), not in the corrigendum's
        summary and not yet confirmed as a problem. These rules can't see the
        other two problems. Muchlinski et al.'s leakage is in an imputation
        step the package doesn't include, and round 3's dropped site is a
        loss of rows, which needs row counts in and out of the merge, i.e.,
        a profile at each stage boundary rather than of the inputs alone,
        the part still to build.
      else: >-
        Not settled; see results/hill-roberts-profile.json.
    evidence:
      - kind: result
        path: results/hill-roberts-profile.json
        values:
          n_files: n_files
          n_files_flagged: n_files_flagged
          n_columns: n_columns_flagged
          n_flags: n_flags
          edu_n: files.data/LucidWideFile.csv.flags.education.0.n
          edu_code: files.data/LucidWideFile.csv.flags.education.0.examples.0
          lucid_edu_n: files.data/LucidWideFile.csv.flags.lucid_education.0.n
          hhi_n: files.data/LucidWideFile.csv.flags.lucid_hhi.0.n
          hhi_code: files.data/LucidWideFile.csv.flags.lucid_hhi.0.examples.0

  # TODO: needs human review
  - question: >-
      Which kinds of errors change conclusions in real research, and who
      finds them?
    answer:
      if g_mod * 2 > g_spec and g_person * 2 > g_changed and g_prof_u < 0.15 and pe_prof_u < 0.15 and g_stale_c == 0 and pe_stale_c == 0 and ag_top == "spec_mismatch" and g_write == 0 and pe_write == 0 and ag_write > 0: >-
        In published human research, mostly wrong models, formulas, and
        readings of results, found by people rather than tools. Of the
        {g_changed} errors that changed a conclusion in general research,
        {g_spec} have a stated mechanism, and {g_mod} of those are
        calculation errors, leakage, misread results, wrong variables, or
        inference errors; in computational physics and engineering errata,
        {pe_mod} of {pe_changed} are calculation or numerical-method
        errors. In general research, {g_person} of the {g_changed} were
        found by the authors, readers, or someone with domain knowledge;
        rerunning code found {g_reran} and profiling data {g_profiled}.
        Errors a generic data profile could catch (sentinel codes, merges,
        and duplicate rows) are {g_prof:.0%} of general research's weighted
        impact and {pe_prof:.0%} of the errata's, or {g_prof_u:.0%} and
        {pe_prof_u:.0%} counting unit errors. Documented stale results are
        nearly absent ({g_stale} in general research, {pe_stale} in the
        errata, none changing a conclusion), but a stale result caught
        before publication leaves no public record, so near-misses can't
        appear here. In the agent sample, methods text that doesn't match
        the code is the largest answer-changer ({ag_top_n} of {ag_changed}),
        found mostly by reading the code ({ag_read} of {ag_changed}), and
        errors introduced in writing, e.g., overclaiming and fabricated
        results, changed or weakened conclusions only there ({ag_write}).
        Caveats: the three samples aren't pooled, since each route selects
        differently, so impact largely reflects the route, e.g., retractions
        are nearly all answer-changing; the taxonomy added types per sample; and
        every row was coded in a single AI pass from public documents,
        {n_unsure} of {n_rows} at medium or low confidence.
      else: >-
        Not settled; see results/real-world-errors.md for each sample.
    evidence:
      - kind: result
        path: results/real-world-errors.json
        values:
          n_rows: n_rows
          n_unsure: n_low_or_medium_confidence
          g_changed: samples.general.changed.n
          g_spec: samples.general.changed.n_specified
          g_mod: samples.general.changed.n_modeling
          g_person: samples.general.changed.n_found_by_person
          g_reran: samples.general.changed.by_how_found.reran_code
          g_profiled: samples.general.changed.by_how_found.profiled_data
          g_prof: samples.general.profile_catchable.core.share
          g_prof_u: samples.general.profile_catchable.with_units.share
          g_stale: samples.general.stale.n
          g_stale_c: samples.general.stale.n_changed
          g_write: samples.general.n_writing_stage
          pe_changed: samples.physics_engineering.changed.n
          pe_mod: samples.physics_engineering.changed.n_modeling
          pe_prof: samples.physics_engineering.profile_catchable.core.share
          pe_prof_u: samples.physics_engineering.profile_catchable.with_units.share
          pe_stale: samples.physics_engineering.stale.n
          pe_stale_c: samples.physics_engineering.stale.n_changed
          pe_write: samples.physics_engineering.n_writing_stage
          ag_changed: samples.agent.changed.n
          ag_top: samples.agent.changed.top_type
          ag_top_n: samples.agent.changed.top_type_n
          ag_read: samples.agent.changed.by_how_found.read_code
          ag_write: samples.agent.n_writing_stage
      - kind: table
        path: results/real-world-errors.md

  # TODO: needs human review
  - question: >-
      What would catch the problems that change conclusions, including
      those auditors skip?
    answer:
      if v2_merge == 0 and hr_found < hr_n and n_flags > 0 and g_prof_u < 0.15 and pe_prof_u < 0.15 and g_mod * 2 > g_spec and ag_top == "spec_mismatch": >-
        Not settled, but a data profile alone isn't it. A profile recorded
        at each stage boundary cheaply catches the problems auditors skip
        because they need a look at the data itself: generic rules flagged
        Hill & Roberts' sentinel code with no knowledge of it ({n_flags}
        flags in all), which only {hr_found} of {hr_n} auditors found, and
        row counts in and out of the merge would show round 3's dropped
        site, which none of {v2_merge_n} auditors at reading speed caught.
        In published research, though, that class is a small share of what
        changes conclusions: {g_prof:.0%} of weighted impact in general
        research and {pe_prof:.0%} in computational physics and engineering
        errata ({g_prof_u:.0%} and {pe_prof_u:.0%} counting unit errors).
        Most answer-changing errors there are in modeling, calculation, and
        interpretation ({g_mod} of {g_spec} with a stated mechanism), found
        by authors, readers, and domain experts ({g_person} of
        {g_changed}).
        So the larger lever is likely making the parameters and choices
        behind each answer cheap for an expert to inspect and vary, and,
        for agent work, checking that the methods text matches the
        pipeline, since that mismatch is the largest answer-changer in the
        agent sample ({ag_top_n} of {ag_changed}). Untested: whether either
        helps experts find more, and whether auditors read a profile when
        it's shown.
      else: >-
        Not settled; see the answers to the questions above.
    evidence:
      - kind: result
        path: results/audit-speed.json
        values:
          v2_merge: rounds.3.settings.v2.found.merge.found
          v2_merge_n: rounds.3.settings.v2.found.merge.possible
      - kind: result
        path: results/real-packages.json
        values:
          hr_found: packages.hill-roberts-2023.found.sentinel
          hr_n: packages.hill-roberts-2023.n_runs
      - kind: result
        path: results/hill-roberts-profile.json
        values:
          n_flags: n_flags
      - kind: result
        path: results/real-world-errors.json
        values:
          g_changed: samples.general.changed.n
          g_spec: samples.general.changed.n_specified
          g_mod: samples.general.changed.n_modeling
          g_person: samples.general.changed.n_found_by_person
          g_prof: samples.general.profile_catchable.core.share
          g_prof_u: samples.general.profile_catchable.with_units.share
          pe_prof: samples.physics_engineering.profile_catchable.core.share
          pe_prof_u: samples.physics_engineering.profile_catchable.with_units.share
          ag_changed: samples.agent.changed.n
          ag_top: samples.agent.changed.top_type
          ag_top_n: samples.agent.changed.top_type_n

  # TODO: needs human review
  - question: >-
      Do coding agents complete stated tasks more reliably in a Calkit
      project than in a plain folder, a Makefile project, or a messy one?
    hypothesis: >-
      Yes: in a Calkit project, an agent's change reaches every result it
      affects, the report's numbers stay generated, and nothing unrelated is
      damaged more often than in the other arms.
    approach: >-
      Give a headless coding agent one task in a fresh copy of each arm's
      template, the same analysis kept five ways (a plain folder, a messy
      folder with and without Git, a Makefile project, and a Calkit
      project), and grade the project it leaves with deterministic checks:
      the report's numbers and figure match the task's reference end state
      (correct), rerunning the project changes nothing (consistent), no raw
      data, history, or unrelated file is harmed (damage), and the report's
      numbers change when the raw data do (traceable).
    answer:
      if calkit_all == calkit_n and make_all == make_n and none_trace == 0 and messy_trace == 0 and mgit_trace == 0 and mgit_also == mgit_stale_n - mgit_stale and make_stale == make_stale_n and calkit_stale == calkit_stale_n and none_correct == none_correct_n and messy_correct == messy_correct_n and mgit_correct_n - mgit_correct == mgit_stale_n - mgit_stale: >-
        Not more than in a careful Makefile project, so far. Every Calkit
        trial ({calkit_all} of {calkit_n}) and every Makefile trial
        ({make_all} of {make_n}) passed all four checks. Agents in the plain
        and messy folders got the numbers right too (correct in
        {none_correct}/{none_correct_n} plain, {messy_correct}/{messy_correct_n}
        messy, and {mgit_correct}/{mgit_correct_n} messy-git trials), but
        none of their reports trace to results (traceable in
        {none_trace}/{none_trace_n}, {messy_trace}/{messy_trace_n}, and
        {mgit_trace}/{mgit_trace_n}), since those reports are typed by hand
        and agents kept them that way. The only failures of correct were in
        a fresh clone whose last commit changed code without rerunning:
        messy-git agents passed in {mgit_stale}/{mgit_stale_n}, {mgit_also}
        of them failing only because they also fixed site D's IDs, which
        the task didn't ask for, against {make_stale}/{make_stale_n} with
        Make and {calkit_stale}/{calkit_stale_n} with Calkit.
        With two trials per arm and task, these tasks were too easy for a
        capable agent to separate Calkit from Make.
      else: >-
        Not settled; see results/agent-reliability.md for every trial.
    evidence:
      - kind: result
        path: results/agent-reliability.json
        values:
          calkit_all: arms.calkit.all.n_all_pass
          calkit_n: arms.calkit.all.n
          make_all: arms.make.all.n_all_pass
          make_n: arms.make.all.n
          none_correct: arms.none.all.correct.pass
          none_correct_n: arms.none.all.correct.n
          messy_correct: arms.messy.all.correct.pass
          messy_correct_n: arms.messy.all.correct.n
          mgit_correct: arms.messy-git.all.correct.pass
          mgit_correct_n: arms.messy-git.all.correct.n
          none_trace: arms.none.all.traceable.pass
          none_trace_n: arms.none.all.traceable.n
          messy_trace: arms.messy.all.traceable.pass
          messy_trace_n: arms.messy.all.traceable.n
          mgit_trace: arms.messy-git.all.traceable.pass
          mgit_trace_n: arms.messy-git.all.traceable.n
          mgit_stale: arms.messy-git.tasks.stale-clone.correct.pass
          mgit_stale_n: arms.messy-git.tasks.stale-clone.correct.n
          mgit_also: arms.messy-git.tasks.stale-clone.n_incorrect_from_also_fixing
          make_stale: arms.make.tasks.stale-clone.correct.pass
          make_stale_n: arms.make.tasks.stale-clone.correct.n
          calkit_stale: arms.calkit.tasks.stale-clone.correct.pass
          calkit_stale_n: arms.calkit.tasks.stale-clone.correct.n
      - kind: table
        path: results/agent-reliability.md

  # TODO: needs human review
  - question: >-
      Do agents notice silent errors they weren't asked about as often in
      tidy projects as in messy ones?
    hypothesis: >-
      No: a pipeline that reruns everything lets an agent finish a task
      without looking at the data, so it notices less.
    approach: >-
      In every trial whose task isn't fixing it, check whether the agent's
      final message mentions the planted silent error, the merge dropping
      site D because its participant IDs aren't zero-padded, by a strict,
      case-sensitive pattern, and compare the messy arms with the rest by a
      one-sided Fisher exact test.
    answer:
      if rest == 0 and messy > 0 and p < 0.01: >-
        No, by this measure. Agents mentioned site D's dropped participants
        unprompted in {messy}/{messy_n} trials in the messy arms (messy
        {m}/{m_n}, messy-git {g}/{g_n}) and in {rest}/{rest_n} in the
        others (plain folder {none}/{none_n}, Make {make}/{make_n}, Calkit
        {calkit}/{calkit_n}; one-sided Fisher exact p = {p:.2g}). The arms
        also differ in tasks, since the plain folder only took the first
        four, and the pattern misses mentions in other words. Untested:
        why, e.g., whether rebuilding a messy project by hand is what
        makes an agent look at the data.
      else: >-
        Not settled; see results/agent-reliability.md for every trial.
    evidence:
      - kind: result
        path: results/agent-reliability.json
        values:
          messy: noticing.messy.noticed
          messy_n: noticing.messy.n
          rest: noticing.rest.noticed
          rest_n: noticing.rest.n
          p: noticing.fisher_p_one_sided
          m: noticing.arms.messy.noticed
          m_n: noticing.arms.messy.n
          g: noticing.arms.messy-git.noticed
          g_n: noticing.arms.messy-git.n
          none: noticing.arms.none.noticed
          none_n: noticing.arms.none.n
          make: noticing.arms.make.noticed
          make_n: noticing.arms.make.n
          calkit: noticing.arms.calkit.noticed
          calkit_n: noticing.arms.calkit.n
      - kind: table
        path: results/agent-reliability.md

  # TODO: needs human review
  - question: Does Calkit cost agents more time or tokens?
    hypothesis: >-
      A little: reading Calkit's skills and running its pipeline take more
      turns than a Makefile.
    approach: >-
      Compare the mean cost the Claude Code CLI reports for each trial,
      which it computes from tokens, and the agent's time and turns, between
      arms that took the same tasks in the same batch: none, make, and
      calkit in batch 1, and make and calkit in batch 2.
    answer:
      if b1_calkit_cost > b1_make_cost and b2_calkit_cost > b2_make_cost: >-
        Somewhat more than Make. On the same tasks, a Calkit trial cost a
        mean ${b1_calkit_cost:.2f} against ${b1_make_cost:.2f} with Make and
        ${b1_none_cost:.2f} in a plain folder in batch 1, and
        ${b2_calkit_cost:.2f} against ${b2_make_cost:.2f} with Make in
        batch 2, where the messy arms took partly different tasks. It took {b1_calkit_min:.1f} and {b2_calkit_min:.1f} min
        against Make's {b1_make_min:.1f} and {b2_make_min:.1f}, in more
        turns ({b1_calkit_turns:.0f} and {b2_calkit_turns:.0f} against
        {b1_make_turns:.0f} and {b2_make_turns:.0f}).
      else: >-
        Not settled; see results/agent-reliability.md for every trial.
    evidence:
      - kind: result
        path: results/agent-reliability.json
        values:
          b1_calkit_cost: by_batch.batch-1.calkit.all.mean_cost_usd
          b1_make_cost: by_batch.batch-1.make.all.mean_cost_usd
          b1_none_cost: by_batch.batch-1.none.all.mean_cost_usd
          b2_calkit_cost: by_batch.batch-2.calkit.all.mean_cost_usd
          b2_make_cost: by_batch.batch-2.make.all.mean_cost_usd
          b1_calkit_min: by_batch.batch-1.calkit.all.mean_minutes
          b1_make_min: by_batch.batch-1.make.all.mean_minutes
          b2_calkit_min: by_batch.batch-2.calkit.all.mean_minutes
          b2_make_min: by_batch.batch-2.make.all.mean_minutes
          b1_calkit_turns: by_batch.batch-1.calkit.all.mean_turns
          b1_make_turns: by_batch.batch-1.make.all.mean_turns
          b2_calkit_turns: by_batch.batch-2.calkit.all.mean_turns
          b2_make_turns: by_batch.batch-2.make.all.mean_turns
      - kind: table
        path: results/agent-reliability.md

environments:
  main:
    kind: uv
    path: pyproject.toml
    description: Python with pandas, for summarizing results and profiling data.
  agent-reliability:
    kind: uv
    path: agent-reliability/pyproject.toml
    description: >-
      Python for the agent reliability benchmark's harness and graders, with
      the analysis packages every arm uses, pinned as in versions.env.

pipeline:
  stages:
    summarize-audit-speed:
      kind: python-script
      script_path: scripts/summarize-audit-speed.py
      environment: main
      description: >-
        Tabulate every round of the audit-speed study, so a new round only
        adds its results file.
      inputs:
        - audit-speed/rounds
      outputs:
        - path: results/audit-speed.json
          storage: git
        - path: results/audit-speed.md
          storage: git
    summarize-real-packages:
      kind: python-script
      script_path: scripts/summarize-real-packages.py
      environment: main
      description: >-
        Count which known problems agent audits of published replication
        packages found.
      inputs:
        - real-packages/audits.json
      outputs:
        - path: results/real-packages.json
          storage: git
        - path: results/real-packages.md
          storage: git
    summarize-real-world-errors:
      kind: python-script
      script_path: scripts/summarize-real-world-errors.py
      environment: main
      description: >-
        Tabulate the coded real-world errors by sample, never pooled: counts
        by type and impact, where and how answer-changing errors arose and
        were found, and the share a data profile could catch.
      inputs:
        - real-world-errors/errors.csv
      outputs:
        - path: results/real-world-errors.json
          storage: git
        - path: results/real-world-errors.md
          storage: git
    import-hill-roberts:
      kind: python-script
      frozen: true
      script_path: scripts/import-dataverse-file.py
      environment: main
      description: >-
        Download the Hill & Roberts (2023) replication archive as first
        deposited (version 1.0, before the corrigendum), verifying the
        checksum Dataverse reports. Frozen once run, since it needs the
        network and the version can't change.
      args:
        - --doi=10.7910/DVN/TVJCTX
        - --version=1.0
        - --file-id=6558488
        - --output=real-packages/hill-roberts-2023/HillRobertsRepArchive.zip
        - --metadata-output=real-packages/hill-roberts-2023/dataverse.json
      outputs:
        - real-packages/hill-roberts-2023/HillRobertsRepArchive.zip
        - path: real-packages/hill-roberts-2023/dataverse.json
          storage: git
    profile-hill-roberts:
      kind: python-script
      script_path: scripts/profile-data.py
      environment: main
      description: >-
        Flag values outside each numeric column's pattern in every CSV of
        the Hill & Roberts archive, with generic rules that know nothing
        about its known problem.
      args:
        - real-packages/hill-roberts-2023/HillRobertsRepArchive.zip
        - --output=results/hill-roberts-profile.json
      inputs:
        - from_stage_outputs: import-hill-roberts
      outputs:
        - path: results/hill-roberts-profile.json
          storage: git
    build-agent-reliability-templates:
      kind: shell-script
      script_path: agent-reliability/build/build_templates.sh
      environment: agent-reliability
      description: >-
        Build each arm's starting project for the agent reliability
        benchmark, replaying one research history in the history arms, with
        the Calkit arm's commands run by Calkit at the commit pinned here,
        into one archive, since the templates hold nested Git repos. Every
        commit is the builder's, and times that would only say when the
        build ran are fixed, so a rebuild gives the same bytes.
      args:
        - 4718ca51d76e1d77b4b5d6c582167d697421203d
        - agent-reliability/templates.tar.gz
        - agent-reliability/templates.json
        - agent-reliability/incoming/participants_2026-05-20_corrected.csv
      inputs:
        - agent-reliability/build
        - agent-reliability/bench/arms.py
        - agent-reliability/bench/archive.py
        - agent-reliability/versions.env
      outputs:
        - agent-reliability/templates.tar.gz
        - path: agent-reliability/templates.json
          storage: git
        - agent-reliability/incoming/participants_2026-05-20_corrected.csv
    check-agent-reliability-templates:
      kind: shell-script
      script_path: agent-reliability/build/check_rebuild.sh
      environment: agent-reliability
      description: >-
        Rebuild the agent reliability templates from scratch and check the
        archive and the incoming file match the build stage's byte for
        byte.
      args:
        - 4718ca51d76e1d77b4b5d6c582167d697421203d
        - agent-reliability/templates.json
        - agent-reliability/incoming/participants_2026-05-20_corrected.csv
        - agent-reliability/templates-rebuild.json
      inputs:
        - from_stage_outputs: build-agent-reliability-templates
        - agent-reliability/build
        - agent-reliability/bench/arms.py
        - agent-reliability/bench/archive.py
        - agent-reliability/versions.env
      outputs:
        - path: agent-reliability/templates-rebuild.json
          storage: git
    build-agent-reliability-reference:
      kind: python-script
      script_path: agent-reliability/bench/reference.py
      environment: agent-reliability
      description: >-
        Compute each agent reliability task's reference end state with a
        reference implementation of the analysis, after checking the
        regenerated raw data and the templates' results match.
      args:
        - agent-reliability/templates.tar.gz
        - agent-reliability/incoming/participants_2026-05-20_corrected.csv
      inputs:
        - from_stage_outputs: build-agent-reliability-templates
        - agent-reliability/bench/arms.py
        - agent-reliability/bench/archive.py
        - agent-reliability/build/generate_data.py
        - agent-reliability/build/make_corrected_participants.py
        - agent-reliability/build/shared/make_figure.py
        - agent-reliability/build/history/make_figure_se.py
      outputs:
        - agent-reliability/reference
    verify-agent-reliability-graders:
      kind: python-script
      script_path: agent-reliability/bench/verify.py
      environment: agent-reliability
      description: >-
        Check the agent reliability graders against the Calkit pinned here:
        unchanged templates should fail, reference solutions pass, and each
        flawed solution be caught.
      args:
        - --templates=agent-reliability/templates.tar.gz
        - --calkit-rev=4718ca51d76e1d77b4b5d6c582167d697421203d
        - --jobs=8
      inputs:
        - from_stage_outputs: build-agent-reliability-templates
        - from_stage_outputs: build-agent-reliability-reference
        - agent-reliability/bench/arms.py
        - agent-reliability/bench/archive.py
        - agent-reliability/bench/grade.py
        - agent-reliability/bench/new_run.py
        - agent-reliability/bench/report.py
        - agent-reliability/bench/solutions.py
        - agent-reliability/build
        - agent-reliability/tasks
        - agent-reliability/preambles
        - agent-reliability/versions.env
      outputs:
        - path: agent-reliability/verification/summary.json
          storage: git
        - agent-reliability/verification/grades
    import-agent-reliability-batch-1:
      kind: python-script
      frozen: true
      script_path: agent-reliability/bench/import_batch.py
      environment: agent-reliability
      description: >-
        Archive the first batch of agent reliability trials, run before the
        benchmark moved into this project with the same harness (headless
        claude -p with project settings only, auto permissions, and
        claude-opus-5-5): 24 trials, the none, make, and calkit arms on
        filter, fix-merge, new-question, and data-correction, twice each,
        with Calkit at ff321ac2c and the templates from before the research
        history was added, which no longer exist; each run's meta.json
        records its template's Git head and files. Copies each run as it
        was, except that this machine's global Git email, which template
        and agent commits made then carry, is replaced with the builder's
        (builder@example.org) in the copied text files, transcripts
        included; the projects' Git objects are as they were. Frozen, since
        the source is a scratch folder outside the repo.
      args:
        - /private/tmp/claude-501/-Users-pete-dev-calkit-s3/3e2d7dae-22cf-428e-b17f-eab18b059494/scratchpad/ar-runs
        - batch-1
      inputs:
        - agent-reliability/bench/arms.py
        - agent-reliability/bench/archive.py
      outputs:
        - agent-reliability/runs/batch-1
    import-agent-reliability-batch-2:
      kind: python-script
      frozen: true
      script_path: agent-reliability/bench/import_batch.py
      environment: agent-reliability
      description: >-
        Archive the second batch of agent reliability trials, run before the
        benchmark moved into this project with the same harness (headless
        claude -p with project settings only, auto permissions, and
        claude-opus-5-5): 46 trials, the history arms (messy, messy-git,
        make, calkit) on provenance, regression, undo, and
        distant-consumer, stale-clone on the Git arms, and fix-merge and
        data-correction on the messy arms, twice each, with Calkit at
        4718ca51d and templates built then by an earlier version of the
        build stage, which differ from its output only where
        results/agent-reliability.md says. Copies each run as it was,
        except that this machine's global Git email, which agent commits
        made then carry, is replaced with the builder's
        (builder@example.org) in the copied text files, transcripts
        included; the projects' Git objects are as they were. Frozen, since
        the source is a scratch folder outside the repo.
      args:
        - /private/tmp/claude-501/-Users-pete-dev-calkit-s3/3e2d7dae-22cf-428e-b17f-eab18b059494/scratchpad/ar-runs2
        - batch-2
      inputs:
        - agent-reliability/bench/arms.py
        - agent-reliability/bench/archive.py
      outputs:
        - agent-reliability/runs/batch-2
    agent-reliability-batch-3:
      kind: python-script
      frozen: true
      script_path: agent-reliability/bench/run_batch.py
      environment: agent-reliability
      description: >-
        Run the agent reliability trials batches/batch-3.csv lists, each a
        headless Claude Code session in a fresh copy of its arm's template,
        in a scratch folder outside the repo, with Calkit at the commit
        pinned here. Frozen, since agent trials cost money; run with
        calkit run --force agent-reliability-batch-3.
      args:
        - batch-3
        - --templates=agent-reliability/templates.tar.gz
        - --calkit-rev=4718ca51d76e1d77b4b5d6c582167d697421203d
        - --jobs=4
      inputs:
        - agent-reliability/batches/batch-3.csv
        - from_stage_outputs: build-agent-reliability-templates
        - from_stage_outputs: build-agent-reliability-reference
        - agent-reliability/bench/arms.py
        - agent-reliability/bench/archive.py
        - agent-reliability/bench/new_run.py
        - agent-reliability/bench/report.py
        - agent-reliability/build/snapshot_calkit.sh
        - agent-reliability/tasks
        - agent-reliability/preambles
        - agent-reliability/versions.env
      outputs:
        - agent-reliability/runs/batch-3
    grade-agent-reliability-batch-1:
      kind: python-script
      script_path: agent-reliability/bench/regrade.py
      environment: agent-reliability
      description: >-
        Grade every archived run of agent reliability batch-1 with the current
        graders, each rerun with the Calkit its trial used.
      args:
        - batch-1
        - --jobs=8
      inputs:
        - from_stage_outputs: import-agent-reliability-batch-1
        - from_stage_outputs: build-agent-reliability-reference
        - agent-reliability/bench/arms.py
        - agent-reliability/bench/archive.py
        - agent-reliability/bench/grade.py
        - agent-reliability/bench/new_run.py
        - agent-reliability/bench/report.py
        - agent-reliability/build/shared/make_figure.py
        - agent-reliability/build/snapshot_calkit.sh
        - agent-reliability/versions.env
      outputs:
        - agent-reliability/grades/batch-1
    grade-agent-reliability-batch-2:
      kind: python-script
      script_path: agent-reliability/bench/regrade.py
      environment: agent-reliability
      description: >-
        Grade every archived run of agent reliability batch-2 with the current
        graders, each rerun with the Calkit its trial used.
      args:
        - batch-2
        - --jobs=8
      inputs:
        - from_stage_outputs: import-agent-reliability-batch-2
        - from_stage_outputs: build-agent-reliability-reference
        - agent-reliability/bench/arms.py
        - agent-reliability/bench/archive.py
        - agent-reliability/bench/grade.py
        - agent-reliability/bench/new_run.py
        - agent-reliability/bench/report.py
        - agent-reliability/build/shared/make_figure.py
        - agent-reliability/build/snapshot_calkit.sh
        - agent-reliability/versions.env
      outputs:
        - agent-reliability/grades/batch-2
    summarize-agent-reliability:
      kind: python-script
      script_path: agent-reliability/bench/summarize.py
      environment: agent-reliability
      description: >-
        Tally every graded agent reliability batch by arm and task, with
        cost, time, and turns, unprompted mentions of site D's dropped
        participants, and tool inputs reaching outside each run.
      args:
        - batch-1
        - batch-2
      inputs:
        - from_stage_outputs: import-agent-reliability-batch-1
        - from_stage_outputs: import-agent-reliability-batch-2
        - from_stage_outputs: grade-agent-reliability-batch-1
        - from_stage_outputs: grade-agent-reliability-batch-2
        - agent-reliability/templates.json
        - agent-reliability/bench/arms.py
      outputs:
        - path: results/agent-reliability.json
          storage: git
        - path: results/agent-reliability.md
          storage: git

datasets:
  - path: real-packages/hill-roberts-2023/HillRobertsRepArchive.zip
    title: Hill & Roberts (2023) replication archive, version 1.0
    description: >-
      The replication package for Hill & Roberts (2023), Political Analysis,
      as first deposited, before the corrigendum (doi:10.1017/pan.2024.27).
      CC0 1.0, per real-packages/hill-roberts-2023/dataverse.json.
    stage: import-hill-roberts
    imported_from:
      url: https://dataverse.harvard.edu/api/access/datafile/6558488
      date: 2026-11-27
      description: >-
        Harvard Dataverse doi:10.7910/DVN/TVJCTX, version 1.0, file
        6558488.
  - path: real-world-errors/errors.csv
    title: Errors in research data analysis, a coded sample
    description: >-
      316 documented errors in published research and agent-made research,
      from I4R replication reports, Retraction Watch, Kapoor & Narayanan's
      leakage list, computational physics and engineering errata, and
      evaluations of AI research agents, coded by an AI agent from public
      documents. See real-world-errors/README.md.
    created_by:
      name: Pete Bachant
      with_ai: Claude Opus 5.5

tables:
  - path: results/audit-speed.md
    title: Audit speed by tool
    description: >-
      Each agent audit of a claim in the audit-speed study, by round and
      tool: whether it found the planted bug, and how long it took.
    stage: summarize-audit-speed
  - path: results/real-packages.md
    title: Agent audits of published replication packages
    description: >-
      Each agent audit of a published replication package with publicly
      documented problems: which of them it found, and what else it raised.
    stage: summarize-real-packages
  - path: results/real-world-errors.md
    title: Errors in published and agent research by type and impact
    description: >-
      Coded errors from published notices and reports, in three samples
      kept apart (human-era general research, computational physics and
      engineering errata, and agent-made research), by error type and
      impact, with the share a data profile could catch.
    stage: summarize-real-world-errors
