name: Check format

on: pull_request

jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The hub frontend format hook runs its pinned Biome via npx
      - name: Install hub frontend dependencies
        run: npm ci
        working-directory: hub/frontend
      - name: Check format
        run: make format
      - name: Fail if any files were reformatted
        if: always()
        run: git diff --exit-code
