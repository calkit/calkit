name: Build the LaTeX image

# Pull requests only build and test; pushing happens on a
# latex-image/vX.Y.Z tag, which is the only place write access is granted
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "images/latex/**"
      - ".github/workflows/latex-image.yml"
  push:
    tags:
      - "latex-image/v*"

jobs:
  build:
    name: Build and smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Only the runner's platform here; the multi-platform build happens
      # on release, where the QEMU emulation time is worth paying
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: images/latex
          load: true
          tags: calkit/latex:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          set -euxo pipefail
          # Both tools have to be on PATH, not merely installed: tlmgr
          # doesn't symlink scripts it installs after setup, which once
          # shipped an image whose latexdiff was invisible
          docker run --rm calkit/latex:pr sh -c '
            set -eux
            latexmk --version
            latexdiff --version
          '
          # A document that needs the curated set, built the way the docs
          # say to build it: with a cache mounted at TEXMFHOME. Mounting
          # it over the distribution instead is what used to leave the
          # container with no TeX at all
          work="$(mktemp -d)"
          cache="$(mktemp -d)"
          mkdir -p "$work/paper"
          cat > "$work/paper/main.tex" <<'EOF'
          \documentclass{article}
          \usepackage{threeparttable}
          \usepackage{multirow}
          \usepackage{enumitem}
          \usepackage{todonotes}
          \begin{document}
          Smoke test.
          \begin{itemize}[noitemsep]
          \item One
          \end{itemize}
          \end{document}
          EOF
          docker run --rm \
            -v "$work":/work \
            -v "$cache":/root/texmf \
            -w /work \
            calkit/latex:pr \
            latexmk -pdf -cd -interaction=nonstopmode paper/main.tex
          test -f "$work/paper/main.pdf"
          # A package outside the curated set installs into the mounted
          # cache and persists there, which is how a project gets what the
          # image doesn't ship
          docker run --rm -v "$cache":/root/texmf calkit/latex:pr sh -c '
            set -eux
            tlmgr --usermode install lipsum
            kpsewhich lipsum.sty
          '
          test -n "$(find "$cache" -name lipsum.sty -print -quit)"
  publish:
    name: Build and push 🐳
    if: startsWith(github.ref, 'refs/tags/latex-image/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/calkit/latex
    steps:
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        run: |
          # refs/tags/latex-image/v1.2.3 -> 1.2.3
          version="${GITHUB_REF#refs/tags/latex-image/v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: images/latex
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
      # An unforgeable statement about where and how the image was built,
      # which increases supply chain security for anyone who consumes it
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
