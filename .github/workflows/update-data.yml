name: Update data

# The pipeline's stages that collect data once a day, e.g., the projects found
# on GitHub and the one-pager's usage numbers, run here rather than in every
# pull request or on every machine, so that work and its API calls happen once
# a day. Their results only add data, so they're committed straight to main,
# with a deploy key the main ruleset lets bypass it.
on:
  schedule:
    # Early in the UTC day, when their schedule inputs go out of date, and off
    # the hour, when GitHub delays or drops scheduled runs most
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # Its results belong on main, not on a branch they'd conflict from
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check for the deploy key
        env:
          HAS_KEY: ${{ secrets.DATA_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Set DATA_DEPLOY_KEY to the private half of a" \
              "deploy key with write access, and let deploy keys bypass" \
              "the main ruleset"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # Its pushes can go straight to main, unlike this run's token's
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          # As in run-pipeline.yml, so built documents are dated and stamped
          # as they would be locally
          fetch-depth: 0
      - name: Configure Git credentials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Calkit from this branch
        run: |
          uv tool install --editable .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the data stages
        uses: ./actions/run
        env:
          # For the gh CLI, which stages search GitHub with
          GH_TOKEN: ${{ github.token }}
        with:
          # Its Docker environments only pull public images
          login_ghcr: "false"
          # A hub superuser's token lets the traction stage read the hub's
          # usage stats; without one, that stage is skipped
          dvc_token: ${{ secrets.CALKIT_STATS_TOKEN }}
          # Only they and what depends on them run, so nothing else reaches
          # main without review
          run_args: --downstream find-calkit-projects
          # Saved below instead, so a push main moved under can be retried
          save: "false"
      - name: Commit the results to main
        run: |
          before=$(git rev-parse HEAD)
          calkit save -am "Update pipeline data" --no-push
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "Nothing changed"
            exit 0
          fi
          for _ in 1 2 3; do
            calkit push && exit 0
            git pull --rebase
          done
          exit 1
