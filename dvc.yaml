stages:
  latex-word-round-trip:
    cmd: calkit xenv -n dev --no-check -- python scripts/latex-word-round-trip.py
    deps:
      - scripts/latex-word-round-trip.py
      - calkit/cli/latex.py
      - calkit/docx.py
      - calkit/latex.py
      - examples/latex-word/calkit.yaml
      - examples/latex-word/paper/main.tex
      - examples/latex-word/paper/methods.tex
      - examples/latex-word/paper/refs.bib
      - examples/latex-word/scripts/plot-wake.py
      - uv.lock
      - .python-version
    outs:
      - results/latex-word-round-trip/original.pdf
      - results/latex-word-round-trip/review.docx
      - results/latex-word-round-trip/review.pdf
      - results/latex-word-round-trip/rebuilt.pdf
      - results/latex-word-round-trip.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'latex-word-round-trip' stage in calkit.yaml.
      Changes made here will be overwritten.
  latex-word-round-trip-figure:
    cmd: calkit xenv -n dev --no-check -- python scripts/plot-latex-word-round-trip.py
    deps:
      - scripts/plot-latex-word-round-trip.py
      - results/latex-word-round-trip/original.pdf
      - results/latex-word-round-trip/review.pdf
      - results/latex-word-round-trip/rebuilt.pdf
      - uv.lock
      - .python-version
    outs:
      - docs/img/latex-word-round-trip.png:
          cache: false
          persist: false
    desc: Automatically generated from the 'latex-word-round-trip-figure' stage in
      calkit.yaml. Changes made here will be overwritten.
  research-flow:
    cmd: calkit xenv -n dev --no-check -- python scripts/research-flow.py
    deps:
      - scripts/research-flow.py
      - uv.lock
      - .python-version
    outs:
      - results/research-flow.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'research-flow' stage in calkit.yaml. Changes
      made here will be overwritten.
  research-flow-figure:
    cmd: calkit xenv -n dev --no-check -- python scripts/plot-research-flow.py
    deps:
      - scripts/plot-research-flow.py
      - results/research-flow.json
      - uv.lock
      - .python-version
    outs:
      - docs/img/research-flow.png:
          cache: false
          persist: false
      - docs/img/research-flow-goals.png:
          cache: false
          persist: false
    desc: Automatically generated from the 'research-flow-figure' stage in calkit.yaml.
      Changes made here will be overwritten.
  one-pager-latex:
    cmd: calkit xenv -n dev --no-check -- python scripts/one-pager-to-latex.py
    deps:
      - scripts/one-pager-to-latex.py
      - calkit.yaml
      - docs/one-pager/main.md
      - docs/one-pager/template.tex
      - docs/one-pager/one-pager.lua
      - results/research-flow.json
      - uv.lock
      - .python-version
    outs:
      - docs/one-pager/main.tex:
          cache: false
          persist: false
    desc: Automatically generated from the 'one-pager-latex' stage in calkit.yaml.
      Changes made here will be overwritten.
  one-pager:
    cmd: calkit latex build -e tex --no-check docs/one-pager/main.tex
    deps:
      - docs/one-pager/main.tex
      - docs/img/pipeline.png
      - .calkit/env-locks/tex
      - docs/one-pager/main.tex
    outs:
      - docs/one-pager/main.pdf:
          cache: false
    desc: Automatically generated from the 'one-pager' stage in calkit.yaml. Changes
      made here will be overwritten.
  latex-image-readme/sizes:
    cmd: calkit xenv -n dev --no-check -- python .calkit/markdown/images/latex/README.md/sizes.py
    deps:
      - .calkit/markdown/images/latex/README.md/sizes.py
      - calkit/latex.py
      - uv.lock
      - .python-version
    outs:
      - images/latex/sizes.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'latex-image-readme/sizes' stage in calkit.yaml.
      Changes made here will be overwritten.
