name: Run tests

# The default token needs no write access; jobs elevate as needed
permissions:
  contents: read

on: pull_request

env:
  CALKIT_TEST_ZENODO_TOKEN: ${{ secrets.CALKIT_ZENODO_TOKEN }}

jobs:
  # Always runs so the gated job below can be a branch protection required
  # check; hub-only PRs are covered by test-hub.yml instead
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      jlab: ${{ steps.filter.outputs.jlab }}
      vscode: ${{ steps.filter.outputs.vscode }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # Negated patterns are ignored under the default 'some'
          # quantifier, which would make this match every change
          predicate-quantifier: "every"
          filters: |
            cli:
              - "**"
              - "!hub/**"
              - "!vscode-ext/**"
            # The JupyterLab extension depends on the core Python package,
            # so run its tests for any change outside the other subprojects
            jlab:
              - "**"
              - "!hub/**"
              - "!vscode-ext/**"
            vscode:
              - "vscode-ext/**"

  main:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config --global init.defaultBranch main
          git config --global push.autoSetupRemote true
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # The tests build many uv environments; a cold
          # cache re-downloads every wheel each run
          enable-cache: true
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          conda-remove-defaults: true
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false
      - name: Install Juliaup
        uses: julia-actions/install-juliaup@ec16ad5cb2e4afb0ca4ea6895e35867a269769a7 # v2
        with:
          channel: "1" # Installs the latest v1 Julia version via Juliaup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: latest
      - name: Run tests
        run: |
          pixi --version
          conda --version
          docker --version || true
          juliaup --version
          Rscript --version
          uv --version
          uv run pytest -n 4 --durations=10
  jupyterlab-ext:
    needs: changes
    if: needs.changes.outputs.jlab == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jupyterlab-ext
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # The tests build many uv environments; a cold
          # cache re-downloads every wheel each run
          enable-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JupyterLab extension dependencies
        run: uv run jlpm install
      - name: Build JupyterLab extension
        run: uv run jlpm build:prod
      - name: Run JupyterLab extension front end unit tests
        run: uv run jlpm test
      - name: Install UI test dependencies
        run: |
          cd ui-tests
          uv run jlpm install
          uv run jlpm playwright install
      - name: Run UI tests
        run: |
          cd ui-tests
          uv run jlpm playwright test -u --reporter=list
      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: jupyterlab-ext/ui-tests/test-results/
          retention-days: 7
  vscode-ext:
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-ext
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run VS Code extension tests
        run: npm test
