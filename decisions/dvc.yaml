stages:
  parse-dvc-lock-pure:
    cmd: calkit xenv -n pure --no-check -- python scripts/parse-dvc-lock.py
      --out=results/ruamel-yaml-clib/pure.json
    deps:
      - scripts/parse-dvc-lock.py
      - .calkit/env-locks/pure
    outs:
      - results/ruamel-yaml-clib/pure.json:
          cache: false
          persist: false
    frozen: true
