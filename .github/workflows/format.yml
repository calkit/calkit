name: Check format

# The default token needs no write access; jobs elevate as needed
permissions:
  contents: read

on: pull_request

jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The tests build many uv environments; a cold
          # cache re-downloads every wheel each run
          enable-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      # The hub frontend format hook runs its pinned Biome via npx
      - name: Install hub frontend dependencies
        run: npm ci
        working-directory: hub/frontend
      # Pre-commit fails if a hook changes a file, but syncing the
      # environment to run it can rewrite uv.lock, which this checks instead
      - name: Check format
        run: make format
      - name: Check uv.lock is up to date
        if: always()
        run: uv lock --check
