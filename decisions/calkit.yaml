name: decisions
title: Decisions
description: >-
  Evidence behind decisions made in developing Calkit, so a claim made to
  justify one can be checked and rerun. Its stages are frozen once run,
  since each records a decision at the time it was made, so the parent
  project's pipeline skips them.

questions:
  - question: >-
      How much faster does DVC parse a large dvc.lock with ruamel.yaml's C
      loader, from ruamel.yaml.clib, installed?
    answer:
      if speedup > 1: >-
        {speedup:.1f}x faster: DVC parsed a generated {kb:.0f} KB dvc.lock
        with {paths} paths in {clib_s:.2f} s with ruamel.yaml.clib
        installed, and {pure_s:.2f} s without it.
      else: >-
        It isn't: DVC parsed a generated {kb:.0f} KB dvc.lock with {paths}
        paths in {clib_s:.2f} s with ruamel.yaml.clib installed, and
        {pure_s:.2f} s without it.
    evidence:
      - kind: result
        path: results/ruamel-yaml-clib.json
        values:
          speedup: speedup
          pure_s: seconds.pure
          clib_s: seconds.clib
          paths: lock.paths
          kb: lock.kb
  - question: >-
      How much CPU time does every command save by not importing
      calkit.environments, and with it pydantic, until a command needs it?
    answer: >-
      {saved_ms:.0f} ms: importing the CLI took {cli_ms:.0f} ms, and
      {with_env_ms:.0f} ms with calkit.environments imported first, as it
      was when calkit.cli.describe imported it at the top. Medians of {n}
      fresh interpreters each.
    evidence:
      - kind: result
        path: results/imports.json
        values:
          saved_ms: saved_ms.environments
          cli_ms: cpu_ms.cli
          with_env_ms: cpu_ms.cli_with_environments
          n: repeats
  - question: >-
      How much CPU time does deferring the schemas of Calkit's models, until
      each is first used, save on importing them?
    answer: >-
      {saved_ms:.0f} ms: importing calkit.models took {deferred_ms:.0f} ms
      with its {models} models' schemas deferred, and {built_ms:.0f} ms with
      all of them built, as defining them did before. Medians of {n} fresh
      interpreters each.
    evidence:
      - kind: result
        path: results/imports.json
        values:
          saved_ms: saved_ms.models
          deferred_ms: cpu_ms.models_deferred
          built_ms: cpu_ms.models_built
          models: models
          n: repeats

environments:
  pure:
    kind: uv-venv
    path: requirements-pure.txt
    prefix: .venv-pure
    python: "3.12"
    description: DVC with ruamel.yaml alone, which parses in pure Python.
  clib:
    kind: uv-venv
    path: requirements-clib.txt
    prefix: .venv-clib
    python: "3.12"
    description: The same, plus ruamel.yaml.clib for its C loader.
  calkit:
    kind: uv
    path: ../pyproject.toml
    description: Calkit itself, from this checkout.

pipeline:
  stages:
    parse-dvc-lock-pure:
      kind: python-script
      frozen: true
      script_path: scripts/parse-dvc-lock.py
      environment: pure
      args:
        - --out=results/ruamel-yaml-clib/pure.json
      outputs:
        - path: results/ruamel-yaml-clib/pure.json
          storage: git
    parse-dvc-lock-clib:
      kind: python-script
      frozen: true
      script_path: scripts/parse-dvc-lock.py
      environment: clib
      args:
        - --out=results/ruamel-yaml-clib/clib.json
      outputs:
        - path: results/ruamel-yaml-clib/clib.json
          storage: git
    compare-dvc-lock-parsing:
      kind: python-script
      frozen: true
      script_path: scripts/compare-dvc-lock-parsing.py
      environment: pure
      inputs:
        - results/ruamel-yaml-clib/pure.json
        - results/ruamel-yaml-clib/clib.json
      outputs:
        - path: results/ruamel-yaml-clib.json
          storage: git
    time-imports:
      kind: python-script
      frozen: true
      script_path: scripts/time-imports.py
      environment: calkit
      args:
        - --out=results/imports.json
      inputs:
        - ../calkit/calc.py
        - ../calkit/cli/describe.py
        - ../calkit/models/base.py
      outputs:
        - path: results/imports.json
          storage: git
