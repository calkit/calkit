name: Test LibreOffice image

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "images/libreoffice/**"
      - ".github/workflows/test-libreoffice-image.yml"
  workflow_dispatch:

jobs:
  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Only the runner's platform here; the multi-platform build happens
      # on release
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: images/libreoffice
          load: true
          tags: calkit/libreoffice:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          set -euxo pipefail
          docker run --rm calkit/libreoffice:pr soffice --version
          # As a non-root user, the way Calkit runs it, converting a
          # document with an equation to Word and back, with a profile of
          # its own as Calkit gives it
          work="$(mktemp -d)"
          cat > "$work/doc.fodt" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <office:document xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:draw="urn:oasis:names:tc:opendocument:xmlns:drawing:1.0" xmlns:math="http://www.w3.org/1998/Math/MathML" office:version="1.3" office:mimetype="application/vnd.oasis.opendocument.text">
           <office:body><office:text>
            <text:p>Smoke test with an equation:
             <draw:frame><draw:object><math:math><math:semantics><math:mrow><math:mi>E</math:mi><math:mo>=</math:mo><math:mi>m</math:mi><math:msup><math:mi>c</math:mi><math:mn>2</math:mn></math:msup></math:mrow></math:semantics></math:math></draw:object></draw:frame>
            </text:p>
           </office:text></office:body>
          </office:document>
          EOF
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$work":/work \
            calkit/libreoffice:pr \
            soffice -env:UserInstallation=file:///work/profile --headless \
              --convert-to "docx:MS Word 2007 XML" --outdir /work/out \
              /work/doc.fodt
          test -f "$work/out/doc.docx"
          # Owned by the user who ran it, not by root
          test -O "$work/out/doc.docx"
          # The equation came through as Word math
          unzip -p "$work/out/doc.docx" word/document.xml | grep -q "<m:oMath"
