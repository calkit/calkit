name: Publish to PyPI

# The default token needs no write access; jobs elevate as needed
permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  check-tag:
    name: Check it's a CLI release
    runs-on: ubuntu-latest
    outputs:
      is-version: ${{ steps.check.outputs.is-version }}
    steps:
      - id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        # Only a version tag, e.g., v0.49.2, is a CLI release; other products
        # use a prefix, e.g., hub/v0.30.14, and hub releases use their name,
        # e.g., one-pager-2026-v1
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "is-version=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    needs: check-tag
    if: needs.check-tag.outputs.is-version == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # The tests build many uv environments; a cold
          # cache re-downloads every wheel each run
          enable-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install pypa/build
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Install JupyterLab extension dependencies and build
        run: |
          cd jupyterlab-ext
          uv run jlpm install --immutable
          uv run jlpm run build:prod
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Generate and build ck9 alias package
        run: |
          bash scripts/make-ck9.sh
          python3 -m build ck9 -o dist/
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/calkit-python
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
  publish-devcontainer:
    name: Publish the dev container image 🐳
    # The image installs the version being released from PyPI, so it can't
    # be built until that version is actually there
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/calkit/devcontainer
    steps:
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        run: |
          version="${{ github.event.release.tag_name }}"
          # Both PyPI and the image tag want the bare version, without the
          # `v` the Git tag carries
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      # PyPI's index can lag the upload by a bit, and the build fails outright
      # if the pinned version isn't resolvable yet
      - name: Wait for the release on PyPI
        run: |
          url="https://pypi.org/pypi/calkit-python/${{ steps.version.outputs.version }}/json"
          for i in $(seq 1 30); do
            if curl -sfo /dev/null "$url"; then
              echo "Found calkit-python ${{ steps.version.outputs.version }}"
              exit 0
            fi
            echo "Not on PyPI yet; retrying in 20s ($i/30)"
            sleep 20
          done
          echo "calkit-python ${{ steps.version.outputs.version }} never appeared on PyPI"
          exit 1
      - name: Log in to the container registry
        uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: calkit/resources/devcontainer
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: CALKIT_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
      # An unforgeable statement about where and how the image was built,
      # which increases supply chain security for anyone who consumes it
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
