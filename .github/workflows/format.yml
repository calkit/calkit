name: Check format

# The default token needs no write access; jobs elevate as needed
permissions:
  contents: read

on:
  pull_request:
  # For the daily pipeline run's pull request, whose pushes don't start it
  workflow_dispatch:

jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The tests build many uv environments; a cold
          # cache re-downloads every wheel each run
          enable-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      # The hub frontend format hook runs its pinned Biome via npx
      - name: Install hub frontend dependencies
        run: npm ci
        working-directory: hub/frontend
      - name: Check format
        run: make format
      - name: Fail if any files were reformatted
        if: always()
        run: git diff --exit-code
