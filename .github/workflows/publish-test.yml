name: Publish to TestPyPI

# The default token needs no write access; jobs elevate as needed
permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    if: "!contains(github.event.release.tag_name, '/')"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The tests build many uv environments; a cold
          # cache re-downloads every wheel each run
          enable-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install pypa/build
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Install JupyterLab extension dependencies and build
        run: |
          cd jupyterlab-ext
          uv run jlpm install --immutable
          uv run jlpm run build:prod
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Generate and build ck9 alias package
        run: |
          bash scripts/make-ck9.sh
          python3 -m build ck9 -o dist/
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/calkit-python
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
