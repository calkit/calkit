  parse-dvc-lock-clib:
    cmd: calkit xenv -n clib --no-check -- python scripts/parse-dvc-lock.py
      --out=results/ruamel-yaml-clib/clib.json
    deps:
      - scripts/parse-dvc-lock.py
      - .calkit/env-locks/clib
