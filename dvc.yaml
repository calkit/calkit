stages:
  latex-word-round-trip:
    cmd: calkit xenv -n dev --no-check -- python
      scripts/latex-word-round-trip.py --engine=libreoffice
    deps:
      - scripts/latex-word-round-trip.py
      - calkit/cli/latex.py
      - calkit/docx.py
      - calkit/latex.py
      - examples/latex-word/calkit.yaml
      - examples/latex-word/paper/main.tex
      - examples/latex-word/paper/methods.tex
      - examples/latex-word/paper/refs.bib
      - examples/latex-word/scripts/plot-wake.py
      - uv.lock
      - .python-version
    outs:
      - results/latex-word-round-trip/original.pdf
      - results/latex-word-round-trip/review.docx
      - results/latex-word-round-trip/rebuilt.pdf
      - results/latex-word-round-trip.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'latex-word-round-trip' stage in
      calkit.yaml. Changes made here will be overwritten.
  latex-word-round-trip-figure:
    cmd: calkit xenv -n dev --no-check -- python
      scripts/plot-latex-word-round-trip.py
    deps:
      - scripts/plot-latex-word-round-trip.py
      - calkit/docx.py
      - results/latex-word-round-trip/original.pdf
      - results/latex-word-round-trip/review.docx
      - results/latex-word-round-trip/rebuilt.pdf
      - uv.lock
      - .python-version
    outs:
      - docs/img/latex-word-round-trip.png:
          cache: false
          persist: false
    desc: Automatically generated from the 'latex-word-round-trip-figure' stage
      in calkit.yaml. Changes made here will be overwritten.
  research-flow:
    cmd: calkit xenv -n dev --no-check -- python scripts/research-flow.py
    deps:
      - scripts/research-flow.py
      - docs/roi/research_flow.py
      - uv.lock
      - .python-version
    outs:
      - results/research-flow.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'research-flow' stage in calkit.yaml.
      Changes made here will be overwritten.
  research-flow-figure:
    cmd: calkit xenv -n dev --no-check -- python scripts/plot-research-flow.py
    deps:
      - scripts/plot-research-flow.py
      - results/research-flow.json
      - uv.lock
      - .python-version
    outs:
      - docs/img/research-flow.png
      - docs/img/research-flow-goals.png
      - docs/img/research-flow-waste.png
    desc: Automatically generated from the 'research-flow-figure' stage in
      calkit.yaml. Changes made here will be overwritten.
  budget-2027:
    cmd: calkit xenv -n dev --no-check -- python scripts/budget.py --workshops=8
      --attendees=25 --supported=60 --indirect-rate=0
    deps:
      - scripts/budget.py
      - docs/one-pager/2027-budget.csv
      - uv.lock
      - .python-version
    outs:
      - results/2027-budget.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'budget-2027' stage in calkit.yaml.
      Changes made here will be overwritten.
  one-pager-font:
    cmd: calkit xenv -n tex --no-check -- sh
      .calkit/stage-commands/one-pager-font.sh
    deps:
      - .calkit/stage-commands/one-pager-font.sh
      - .calkit/env-locks/tex
    outs:
      - docs/one-pager/texgyreheros-regular.otf
    desc: Automatically generated from the 'one-pager-font' stage in
      calkit.yaml. Changes made here will be overwritten.
  budget-2027-figure:
    cmd: calkit xenv -n dev --no-check -- python scripts/plot-budget.py
    deps:
      - scripts/plot-budget.py
      - results/2027-budget.json
      - docs/one-pager/texgyreheros-regular.otf
      - uv.lock
      - .python-version
    outs:
      - docs/img/2027-budget.png
    desc: Automatically generated from the 'budget-2027-figure' stage in
      calkit.yaml. Changes made here will be overwritten.
  find-calkit-projects:
    cmd: calkit xenv -n dev --no-check -- python scripts/find-calkit-projects.py
    deps:
      - scripts/find-calkit-projects.py
      - .calkit/local/current-periods/1-day-utc.txt
      - uv.lock
      - .python-version
    outs:
      - data/calkit-projects/projects.csv:
          cache: false
          persist: false
    desc: Automatically generated from the 'find-calkit-projects' stage in
      calkit.yaml. Changes made here will be overwritten.
  find-calkit-papers:
    cmd: calkit xenv -n dev --no-check -- python scripts/find-calkit-papers.py
    deps:
      - scripts/find-calkit-papers.py
      - .calkit/local/current-periods/1-day-utc.txt
      - data/calkit-projects/projects.csv
      - uv.lock
      - .python-version
    outs:
      - data/calkit-projects/papers.csv:
          cache: false
          persist: false
    desc: Automatically generated from the 'find-calkit-papers' stage in
      calkit.yaml. Changes made here will be overwritten.
  traction:
    cmd: calkit xenv -n dev --no-check -- python scripts/traction.py
      --exclude-hub-account=pwbachant --exclude-hub-account=calkit
    deps:
      - scripts/traction.py
      - .calkit/local/current-periods/1-day-utc.txt
      - data/calkit-projects/papers.csv
      - uv.lock
      - .python-version
    outs:
      - results/traction.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'traction' stage in calkit.yaml.
      Changes made here will be overwritten.
  one-pager/pdf:
    cmd: calkit latex from-markdown docs/one-pager/main.md -o
      docs/one-pager/main.pdf -e tex --no-check --template
      docs/one-pager/template.tex --filter docs/one-pager/one-pager.lua
      --pandoc-arg=--shift-heading-level-by=-1
    deps:
      - docs/one-pager/main.md
      - docs/one-pager/one-pager.lua
      - results/traction.json
      - results/2027-budget.json
      - docs/img/pipeline.png
      - docs/img/2027-budget.png
      - calkit.yaml
      - .calkit/env-locks/tex
      - docs/one-pager/template.tex
    outs:
      - docs/one-pager/main.pdf:
          cache: true
    desc: Automatically generated from the 'one-pager/pdf' stage in calkit.yaml.
      Changes made here will be overwritten.
  latex-image-readme/sizes:
    cmd: calkit xenv -n dev --no-check -- python
      .calkit/markdown/images/latex/README.md/sizes.py
    deps:
      - .calkit/markdown/images/latex/README.md/sizes.py
      - calkit/latex.py
      - uv.lock
      - .python-version
    outs:
      - images/latex/sizes.json:
          cache: false
          persist: false
    desc: Automatically generated from the 'latex-image-readme/sizes' stage in
      calkit.yaml. Changes made here will be overwritten.
