name: Check format

# The default token needs no write access; jobs elevate as needed
permissions:
  contents: read

on: pull_request

jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # The tests build many uv environments; a cold
          # cache re-downloads every wheel each run
          enable-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      # The hub frontend format hook runs its pinned Biome via npx
      - name: Install hub frontend dependencies
        run: npm ci
        working-directory: hub/frontend
      - name: Check format
        run: make format
      - name: Fail if any files were reformatted
        if: always()
        run: git diff --exit-code
