# yaml-language-server: $schema=https://docs.calkit.org/schemas/calkit.json
owner: calkit
name: calkit
title: Calkit
hub: https://calkit.io
description: >-
  Calkit's claims about itself, e.g., in its docs, computed by its own
  pipeline so they stay true.

questions:
  - question: What is the difference in research productivity, in terms of
      time to valuable knowledge, from working on all stages together in
      small steps, akin to one piece flow in lean manufacturing,
      versus a more waterfall, stage gate style?
    hypothesis: An agile, lean approach is ~2x more efficient.
    answer:
      if r_combined >= 2: >-
        Yes, in a simulation of a six-finding paper: working in small steps
        with automated tooling, as in continuous delivery, reached a
        published paper {r_combined:.1f}x sooner than working stage by stage
        with manual tooling, and fit {s_combined:.1f}x as many papers into a
        PhD with half the time spent waiting on reviews put to other use.
        It takes both: small steps alone gave {r_manual:.1f}x and the
        tooling alone {r_tooling:.1f}x.
      else: >-
        Not in a simulation of a six-finding paper, where working in small
        steps with automated tooling, as in continuous delivery, reached a
        published paper {r_combined:.1f}x sooner than working stage by stage
        with manual tooling, and fit {s_combined:.1f}x as many papers into a
        PhD with half the time spent waiting on reviews put to other use.
    evidence:
      - kind: figure
        path: docs/img/research-flow.png
      - kind: result
        path: results/research-flow.json
        values:
          r_combined: ratio.days_combined
          s_combined: ratio.student_days_combined
          r_manual: ratio.days_manual
          r_tooling: ratio.days_tooling
  - question: >-
      What most slows research and limits iteration in the status quo, and
      how do agents change that?
    answer: >-
      In a simulation of a six-finding paper worked stage by stage with
      manual tooling, waiting on the PI to review big batches takes
      {sq_wait:.0%} of the time to a published paper, more than anything
      else, and breaking the batches up gives {batch_loops:.1f}x as many
      feedback loops. The batches are big because tool hopping and review
      prep cost something on every iteration: worked in small steps with
      today's tools, tool hopping is the largest waste, at {hop:.0%} of the
      time, and taking it away publishes {hop_gain:.2f}x sooner with
      {hop_flaws:.0%} fewer flaws. Agents shrink the hands-on work, so
      waiting on the PI grows to {agents_wait:.0%}.
    evidence:
      - kind: figure
        path: docs/img/research-flow-waste.png
      - kind: result
        path: results/research-flow.json
        values:
          sq_wait: waste.headline.status_quo_waiting_share
          agents_wait: waste.headline.agents_waiting_share
          batch_loops: waste.headline.batches_loops_gain
          hop: waste.headline.small_steps_hopping_share
          hop_gain: waste.headline.small_steps_hopping_gain
          hop_flaws: waste.headline.small_steps_hopping_flaw_cut
  - question: >-
      Can Calkit convert LaTeX to docx and back again without losing
      information, e.g., in math, or comments?
    answer:
      if same and pdf_same and eq_docx == eq_src and inline_docx == inline_src and threads_docx == threads_src:
        >-
        Yes, for the LaTeX/Word example: exported to Word and merged back
        with no edits, its source comes back byte for byte and builds the
        same PDF, and all {eq_src} display equation rows, {inline_src}
        inline expressions and {threads_src} comment threads went into the
        Word copy.
      else: >-
        Not yet: exported to Word and merged back with no edits, the
        example's source came back unchanged: {same}; the PDF rebuilt the
        same: {pdf_same}; {eq_docx} of {eq_src} display equation rows,
        {inline_docx} of {inline_src} inline expressions and
        {threads_docx} of {threads_src} comment threads went into Word.
    evidence:
      - kind: figure
        path: docs/img/latex-word-round-trip.png
      - kind: result
        path: results/latex-word-round-trip.json
        values:
          same: source_unchanged
          pdf_same: pdf_unchanged
          eq_src: display_equations.source
          eq_docx: display_equations.docx
          inline_src: inline_equations.source
          inline_docx: inline_equations.docx
          threads_src: comment_threads.source
          threads_docx: comment_threads.docx

requirements:
  - docker
  - uv

environments:
  dev:
    kind: uv
    path: pyproject.toml
    description: Calkit itself, from this checkout, with its dev tools.
  tex:
    kind: docker
    image: ghcr.io/calkit/latex:0.1.6
    description: Calkit's TeX Live image via Docker.

pipeline:
  stages:
    latex-word-round-trip:
      kind: python-script
      script_path: scripts/latex-word-round-trip.py
      environment: dev
      description: >-
        Export the LaTeX/Word example to Word and merge it back, with no
        edits, and count what went out and came back.
      inputs:
        - calkit/cli/latex.py
        - calkit/docx.py
        - calkit/latex.py
        - examples/latex-word/calkit.yaml
        - examples/latex-word/paper/main.tex
        - examples/latex-word/paper/methods.tex
        - examples/latex-word/paper/refs.bib
        - examples/latex-word/scripts/plot-wake.py
      outputs:
        - results/latex-word-round-trip/original.pdf
        - results/latex-word-round-trip/review.docx
        - results/latex-word-round-trip/review.pdf
        - results/latex-word-round-trip/rebuilt.pdf
        - path: results/latex-word-round-trip.json
          storage: git
    latex-word-round-trip-figure:
      kind: python-script
      script_path: scripts/plot-latex-word-round-trip.py
      environment: dev
      inputs:
        - results/latex-word-round-trip/original.pdf
        - results/latex-word-round-trip/review.pdf
        - results/latex-word-round-trip/rebuilt.pdf
      outputs:
        - path: docs/img/latex-word-round-trip.png
          storage: git
    research-flow:
      kind: python-script
      script_path: scripts/research-flow.py
      environment: dev
      description: >-
        Simulate a paper worked in small steps versus stage by stage, with
        manual and automated tooling.
      inputs:
        - docs/simulator/research_flow.py
      outputs:
        - path: results/research-flow.json
          storage: git
    research-flow-figure:
      kind: python-script
      script_path: scripts/plot-research-flow.py
      environment: dev
      inputs:
        - results/research-flow.json
      outputs:
        - docs/img/research-flow.png
        - docs/img/research-flow-goals.png
        - docs/img/research-flow-waste.png
    budget-2027:
      kind: python-script
      script_path: scripts/budget.py
      environment: dev
      description: >-
        Total up the budget for the 2027 pilot that the one-pager asks for.
      args:
        - --workshops=4
        - --attendees=25
        - --supported=20
        - --indirect-rate=0
      inputs:
        - docs/one-pager/2027-budget.csv
      outputs:
        - path: results/2027-budget.json
          storage: git
    one-pager:
      kind: markdown
      target_path: docs/one-pager/main.md
      description: >-
        Build the one-pager into a PDF, with its values read from the
        results and linked to the questions they bear on.
      pdf:
        environment: tex
        template_path: docs/one-pager/template.tex
        filters:
          - docs/one-pager/one-pager.lua
        args:
          - --shift-heading-level-by=-1
    latex-image-readme:
      kind: markdown
      target_path: images/latex/README.md
      environment: dev

figures:
  - path: docs/img/latex-word-round-trip.png
    title: LaTeX to Word and back
    description: >-
      A page of the LaTeX/Word example as built from LaTeX, as exported to
      Word, and as built again after merging the Word copy back.
    stage: latex-word-round-trip-figure
  - path: docs/img/research-flow.png
    title: Research flow simulation
    description: >-
      Time to a published paper worked in small steps versus stage by
      stage, by how often reviews happen, and by handoff cost and flaw rate.
    stage: research-flow-figure
  - path: docs/img/research-flow-goals.png
    title: Research productivity, goal by goal
    description: >-
      Improvement over working stage by stage with manual tooling on a first
      paper, as agents, small steps, Calkit's tooling, faster collaboration,
      faster verification, and agent-assisted PI review are added in turn.
    stage: research-flow-figure
  - path: docs/img/research-flow-waste.png
    title: Waste in the research workflow
    description: >-
      Where the time to a published paper goes, with and without agents and
      small steps, and how much faster it gets with each kind of waste
      removed on its own.
    stage: research-flow-figure

tables:
  - path: docs/one-pager/2027-budget.csv
    title: Budget for the 2027 pilot
    description: >-
      Line items for a six-month pilot of workshops and supported project
      conversions, from which the one-pager's ask is computed.

references:
  - path: references.bib
